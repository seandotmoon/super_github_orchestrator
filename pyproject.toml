[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-orchestrator"
version = "0.1.0"
description = "Serial GitHub issue orchestrator that drives OpenCode agents to implement, review, and merge PRs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0.0,<2",
  "langgraph-checkpoint-sqlite>=3.0.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "mypy>=1.10.0",
]

[project.scripts]
super-orchestrator = "super_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/super_orchestrator"]

[tool.hatch.build.targets.sdist]
include = [
  "src/super_orchestrator",
  "templates",
  "tests",
  "README.md",
]

[tool.mypy]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "super_orchestrator.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
