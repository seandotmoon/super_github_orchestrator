[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-orchestrator"
version = "0.1.0"
description = "Serial GitHub issue orchestrator that drives OpenCode agents to implement, review, and merge PRs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
super-orchestrator = "super_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/super_orchestrator"]

[tool.hatch.build.targets.sdist]
include = [
  "src/super_orchestrator",
  "templates",
  "tests",
  "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
